name: Publish static site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect website files
        run: |
          mkdir _site
          cp index.html task.html app.js catalog.js examples.js media-records.js style.css _site/
          cp -R images media _site/
          test -z "$(find _site -type f -size +40000000c -print -quit)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
